# ---------------- Edge Device ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-device
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-device
  template:
    metadata:
      labels:
        app: edge-device
    spec:
      containers:
        - name: edge-device
          image: hcmqttedge:latest
          imagePullPolicy: IfNotPresent 
          env:
            - name: MQTT_BROKER
              value: "mosquitto"

# ---------------- Frontend ----------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hcmqttfrontend:latest
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007




